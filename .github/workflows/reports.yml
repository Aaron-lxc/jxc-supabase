# ============================================================================
# 进销存定时推送（GitHub Actions，免费）
# 说明：GitHub cron 为 UTC，已按北京时间(GMT+8)换算：
#   北京 09:00 = UTC 01:00 | 北京 08:00 = UTC 00:00 | 北京 15:00 = UTC 07:00
# 所需仓库 Secrets（Settings → Secrets → Actions）：
#   SUPABASE_URL / SUPABASE_SERVICE_KEY / WORKSPACE_ID
#   WECOM_CORPID / WECOM_AGENT_SECRET / WECOM_AGENTID
#   DETAIL_BASE_URL / DETAIL_SECRET
#   RECIPIENTS_JSON  （完整 recipients.json 内容）
# ============================================================================
name: jxc-reports

on:
  schedule:
    - cron: '0 1 1 * *'   # 每月1号 北京09:00 → 资源/区域合伙人月佣金
    - cron: '0 0 * * *'   # 每天 北京08:00 → 欠款/库存预警
    - cron: '0 7 * * 6'   # 每周六 北京15:00 → 本周经营
    - cron: '0 7 1 * *'   # 每月1号 北京15:00 → 上月经营
  workflow_dispatch:       # 允许手动触发调试

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 写配置
        working-directory: scripts/wecom-reports
        run: |
          cat > config.json <<EOF
          {
            "supabaseUrl": "${{ secrets.SUPABASE_URL }}",
            "supabaseServiceKey": "${{ secrets.SUPABASE_SERVICE_KEY }}",
            "workspaceId": "${{ secrets.WORKSPACE_ID }}",
            "wecom": {
              "corpid": "${{ secrets.WECOM_CORPID }}",
              "agentSecret": "${{ secrets.WECOM_AGENT_SECRET }}",
              "agentid": ${{ secrets.WECOM_AGENTID }}
            },
            "detailBaseUrl": "${{ secrets.DETAIL_BASE_URL }}",
            "detailSecret": "${{ secrets.DETAIL_SECRET }}"
          }
          EOF
          cat > recipients.json <<'EOF'
          ${{ secrets.RECIPIENTS_JSON }}
          EOF

      - name: 运行推送
        working-directory: scripts/wecom-reports
        run: |
          node --version
          # 根据触发时间判断本次运行哪个报表
          HOUR=$(date -u +%H); DOM=$(date -u +%d); DOW=$(date -u +%u)
          if [ "$DOM" = "01" ] && [ "$HOUR" = "01" ]; then
            node run.js resource && node run.js region
          elif [ "$HOUR" = "00" ]; then
            node run.js arrears && node run.js stock
          elif [ "$DOW" = "6" ] && [ "$HOUR" = "07" ]; then
            node run.js weekly
          elif [ "$DOM" = "01" ] && [ "$HOUR" = "07" ]; then
            node run.js monthly
          else
            echo "非计划触发时间，跳过（手动触发请到下方步骤指定参数）"
          fi
